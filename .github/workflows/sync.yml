name: Sync tool list from the live server

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sync.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md tools.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md tools.json
            git commit -m "Sync tool list from the live server"
            git push
          else
            echo "No change."
          fi
